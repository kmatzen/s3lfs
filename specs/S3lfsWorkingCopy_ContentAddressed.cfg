\* Keys derived from content alone, so identical bytes at two paths alias.
\* Expected to violate NoCollateralDeletion and NoDanglingReference.
SPECIFICATION Spec

CONSTANTS
    Paths = {p1, p2}
    Contents = {c1, c2}
    Absent = absent
    CLOBBER_GUARD = TRUE
    PATH_AWARE_KEYS = FALSE

INVARIANT
    TypeOK
    NoDataLoss
    NoDanglingReference
    NoCollateralDeletion

CHECK_DEADLOCK FALSE
