name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Any base branch, so stacked PRs are checked before their base merges.
    branches: ["**"]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range on Linux, plus a
        # macOS run: s3lfs shells out to git constantly and writes /bin/sh
        # hooks, so a second platform is worth more than a third minor
        # version.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Show versions
        run: |
          uv run python -V
          git --version

      - name: Run Tests
        run: uv run pytest --cov=s3lfs --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          slug: kmatzen/s3lfs
          fail_ci_if_error: false

  verify:
    name: Model checking (TLA+)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Checks both directions: properties that must hold, and models of
      # known defects that must still violate their invariant -- otherwise
      # the property is vacuous and proves nothing.
      - name: Check TLA+ models
        run: ./specs/check.sh

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://localhost:9000 minioadmin minioadmin
          /tmp/mc mb local/bench

      - name: Install s5cmd
        run: |
          curl -sL https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Linux-64bit.tar.gz \
            | tar -xz -C /tmp s5cmd

      # The manifest benchmark gates the build: sharding must beat a flat
      # manifest by ratio, which holds on any runner speed. The transfer
      # benchmark is informational -- localhost numbers overstate per-file
      # costs and shared runners are noisy, so it publishes a table for
      # humans instead of enforcing a threshold.
      - name: Manifest scaling (gating)
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run python benchmarks/manifest_scaling.py 50000 25 --check \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Transfer comparison vs s5cmd (informational)
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Localhost MinIO: per-file costs are overstated relative to" \
            "a real network; use for trend-watching only." \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run python benchmarks/transfer_comparison.py \
            --bucket bench --endpoint-url http://localhost:9000 \
            --files 50 --size-kb 512 --s5cmd /tmp/s5cmd --no-encryption \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration Tests (MinIO)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create test bucket
        run: |
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://localhost:9000 minioadmin minioadmin
          /tmp/mc mb local/integration-test

      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          S3LFS_TEST_ENDPOINT: http://localhost:9000
          S3LFS_TEST_BUCKET: integration-test
        run: uv run pytest tests/test_integration_minio.py -v
